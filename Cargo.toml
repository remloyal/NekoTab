[package]
name = "nekotab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "极简自部署书签导航（Dioxus 0.7 fullstack）"
license = "MIT"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 仅 server 编译：数据库 / 运行时 / 配置 ----
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
dotenvy = { version = "0.15", optional = true }
anyhow = { version = "1", optional = true }
# 服务端代取「一言」接口。dioxus-fullstack 已经把 reqwest 按 rustls 编进来了，
# 这里只是启用 json feature，不引入新 crate，也不需要系统 OpenSSL。
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
# 响应压缩（gzip + brotli）。两层各管一段：
#   * 静态产物（wasm / js / css）由 dx 在构建期压成 .br（Dioxus.toml 的 pre_compress，
#     质量 11），dioxus-server 的 ServeFile::precompressed_br() 直接把那份发出去，
#     运行时零 CPU；这层碰不到它们（响应已带 content-encoding，会被跳过）。
#   * 这层负责其余动态响应：SSR 的 HTML、server function 的 JSON。brotli 能再省
#     一成多（HTML 3508 -> 3094 B），只认 gzip 的客户端自动退回 gzip。
# quality 显式设 6：tower-http 给实时 brotli 的默认是 4（沿用 nginx 的取舍），
# 抬到 6 多花的 CPU 可以忽略；gzip 默认本来就是 6，不受影响。
tower-http = { version = "0.6", optional = true, default-features = false, features = [
    "compression-gzip",
    "compression-br",
] }
# 访问密码的会话签名（HMAC-SHA256）与常量时间比较。
# ring 本来就在 reqwest/rustls 的依赖树里，直接声明只是启用它，不会多编一份。
ring = { version = "0.17", optional = true }

# ---- 仅 web（wasm）编译：时钟、农历、搜索跳转、指针拖拽、panic 现场 ----
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
js-sys = { version = "0.3", optional = true }
# wasm-bindgen 本就随 dioxus/web 进了依赖树，这里只是显式声明以便直接用
# `JsCast`（DOM 事件的 downcast、元素类型转换需要）。
wasm-bindgen = { version = "0.2", optional = true }
# 读本地文件走 document::eval + FileReader（在 JS 里），因此不需要 web-sys 的
# File / FileList / FileReader / Blob 这些绑定。
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    # 主题「跟随系统」：读 / 监听 (prefers-color-scheme: dark)
    "MediaQueryList",
    # 书签小工具要拼出本应用的来源地址
    "Location",
    "console",
] }

[features]
default = []
web = [
    "dioxus/web",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:reqwest",
    "dep:tower-http",
    "dep:ring",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
