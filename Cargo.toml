[package]
name = "mtab-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "极简自部署书签导航（Dioxus 0.7 fullstack）"
license = "MIT"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 仅 server 编译：数据库 / 运行时 / 配置 ----
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
dotenvy = { version = "0.15", optional = true }
anyhow = { version = "1", optional = true }
# 服务端代取「一言」接口。dioxus-fullstack 已经把 reqwest 按 rustls 编进来了，
# 这里只是启用 json feature，不引入新 crate，也不需要系统 OpenSSL。
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }

# ---- 仅 web（wasm）编译：首页时钟、搜索跳转 ----
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window"] }

[features]
default = []
web = ["dioxus/web", "dep:gloo-timers", "dep:js-sys", "dep:web-sys"]
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:dotenvy",
    "dep:anyhow",
    "dep:reqwest",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
