# 单容器应用的 compose 配置。默认直接使用已发布的多架构镜像（Docker Hub）。
#
# 常用命令：
#   docker compose up -d                          # 拉取 remloyal001/nekotab:latest 并启动
#   docker compose logs -f
#   docker compose pull && docker compose up -d    # 升级到新镜像
#   docker compose down                            # 停止（保留数据卷）
#   docker compose down -v                         # 停止并清空数据
#
# 说明：
#   * 监听地址变量是 IP 不是 HOST（由 dioxus-cli-config 读取），详见 README。
#   * 宿主端口默认 8080，可用 NEKOTAB_PORT 覆盖；本机跑 dx serve 时它会占用 8080。
#   * 数据落在命名卷 nekotab-data 的 /data 下，容器重建不丢。
#
#   想改成「用本机打包的产物构建镜像」（不经过 Docker Hub）：
#     bash scripts/pack-linux.sh        # 产物在 dist/amd64（arm64 则是 dist/arm64）
#     然后注释掉下面的 image，启用 build（context 按目标架构改）。
services:
  nekotab:
    image: remloyal001/nekotab:latest
    # build:
    #   context: dist/amd64
    #   dockerfile: ../../Dockerfile.prebuilt
    container_name: nekotab
    ports:
      - "${NEKOTAB_PORT:-8080}:8080"
    volumes:
      - nekotab-data:/data
    environment:
      IP: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: "sqlite:///data/mtab.db?mode=rwc"
    restart: unless-stopped
    # 运行镜像里没有 curl/wget，用 bash 的 /dev/tcp 做 TCP 探活即可。
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  nekotab-data:
